[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ccm-audit-export"
version = "0.1.0"
description = "Deterministic offline evidence-package export, redaction declaration, integrity manifest, and verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kingsley Okafor" }]
dependencies = ["pydantic>=2.10,<3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.scripts]
ccm-audit-export = "ccm_audit_export.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccm_audit_export"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ccm_audit_export"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=ccm_audit_export --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ccm_audit_export"]

[tool.coverage.report]
show_missing = true
skip_covered = false
